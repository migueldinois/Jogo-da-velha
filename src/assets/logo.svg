<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo suave para o quadrado arredondado -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Sombra elegante para o ícone estilo App -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>

    <!-- Gradiente para o X (Azul) -->
    <linearGradient id="xGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Gradiente para o O (Vermelho) -->
    <linearGradient id="oGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
  </defs>

  <!-- Base com cantos arredondados -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGradient)" filter="url(#dropShadow)" stroke="#E2E8F0" stroke-width="2" />

  <!-- Símbolo X -->
  <g fill="none" stroke="url(#xGradient)" stroke-width="42" stroke-linecap="round">
    <line x1="140" y1="180" x2="240" y2="330" />
    <line x1="240" y1="180" x2="140" y2="330" />
  </g>

  <!-- Símbolo O -->
  <circle cx="335" cy="255" r="72" fill="none" stroke="url(#oGradient)" stroke-width="40" />
</svg>
